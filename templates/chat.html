{% extends "base.html" %}

{% block title %}AI Asistan{% endblock %}

{% block content %}

<section class="panel chat-panel">

  <div class="chat-header">

    <h2>💬 AI Asistan</h2>

    <div class="chat-controls">

      <select id="kategori-filtre" onchange="chatYukle()" title="Kategoriye göre filtrele">
        <option value="hepsi">🔵 Tümü</option>
        <option value="istatistik">📊 İstatistik</option>
        <option value="sorgu">🔍 Sorgu</option>
        <option value="oneri">🎯 Öneri</option>
        <option value="analiz">🧠 Analiz</option>
        <option value="sohbet">💬 Sohbet</option>
      </select>

      <select id="model-select"></select>

      <button onclick="chatTemizle()">🧹 Temizle</button>

    </div>
    <div class="model-hint-text" style="font-size: 12px; color: #8b949e; margin-top: -5px; margin-bottom: 10px; text-align: right;">
      💡 <strong>İpucu:</strong> Derin ve uzun analizler için <strong>14B</strong>, günlük hızlı sorgular için <strong>7B</strong> modelini tercih edin.
    </div>

  </div>

  <div id="chat-messages" class="chat-messages"></div>

  <div class="chat-input">

    <textarea
      id="chat-input"
      placeholder="Veritabanına bir şeyler sor... (Enter = gönder, Shift+Enter = yeni satır)"
      rows="1"
      autofocus></textarea>

    <button onclick="chatGonder()" class="btn-gonder">Gönder</button>

  </div>

</section>

{% endblock %}
